name: PR MLOps Pipeline

on:
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-train:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
      MLFLOW_ARTIFACT_ROOT: ./mlartifacts
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: pytest -q
      - name: Generate data
        run: python generate_data.py
      - name: Train model
        run: python src/train.py
      - name: Check accuracy
        run: python src/check_accuracy.py
      - name: Authenticate to GCP
        if: success()
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Configure gcloud project
        if: success()
        run: gcloud config set project ${{ secrets.GCP_PROJECT }}
      - name: Upload model to GCS
        if: success()
        run: |
          gsutil cp models/model.pkl gs://${{ secrets.GCS_BUCKET }}/models/latest/model.pkl
      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: model-and-metrics
          path: |
            models/model.pkl
            outputs/metrics.json
