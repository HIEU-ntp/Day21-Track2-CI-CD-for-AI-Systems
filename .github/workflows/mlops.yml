name: mlops

on:
  push:
    branches: [ main ]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
      - 'generate_data.py'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: pytest -v

  train:
    needs: test
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
      MLFLOW_ARTIFACT_ROOT: ./mlartifacts
      GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc[gs]
      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v1
        with:
          create_credentials_file: true
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Generate and version data
        run: |
          python generate_data.py
          dvc commit --force data/train_phase1.csv.dvc data/eval.csv.dvc data/train_phase2.csv.dvc
          export GOOGLE_APPLICATION_CREDENTIALS="${{ steps.auth.outputs.credentials_file_path }}"
          dvc push -v

      - name: Train model
        run: python src/train.py

      - name: Check evaluation threshold
        run: python src/check_accuracy.py

      - name: Upload model to GCS
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="${{ steps.auth.outputs.credentials_file_path }}"
          gsutil cp models/model.pkl gs://${{ secrets.GCS_BUCKET }}/models/latest/model.pkl

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-and-metrics
          path: |
            models/model.pkl
            outputs/metrics.json

  deploy:
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v1
        with:
          create_credentials_file: true
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Verify model in GCS
        run: |
          gsutil ls gs://${{ secrets.GCS_BUCKET }}/models/latest/model.pkl
          echo "✅ Model deployed successfully to GCS"
